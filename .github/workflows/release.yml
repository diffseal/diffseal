name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Require release notes in an annotated tag
        run: test "$(git cat-file -t "$GITHUB_REF")" = tag
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Verify tagged build
        run: |
          bun run build
          git diff --exit-code -- dist/
          test -z "$(git ls-files --others --exclude-standard -- dist/)"
      - name: Package release
        run: |
          tar -czf "$RUNNER_TEMP/diffseal-$GITHUB_REF_NAME.tgz" dist LICENSE README.md
      - name: Publish release with tag notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/diffseal-$GITHUB_REF_NAME.tgz" \
            --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME" "${flags[@]}"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish to npm
        # Trusted publishing: npm checks this workflow's GitHub identity (id-token), so no token is stored.
        # Configure it once on npmjs.com: package diffseal > Settings > Trusted Publisher > GitHub Actions,
        # organization diffseal, repository diffseal, workflow release.yml.
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "diffseal@$version" version >/dev/null 2>&1; then
            echo "diffseal@$version is already on npm; publishing is skipped."
            exit 0
          fi
          npm install -g npm@11.17.0
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--tag beta); fi
          npm publish --access public "${flags[@]}"

name: Diffseal upload
on:
  workflow_call:
    inputs:
      # The only input. It says how long the full report is kept and never reaches the analysis.
      retention-days:
        description: 'Days to keep the report artifact of each run. GitHub caps it at the repository or organisation maximum; 0 uses that setting.'
        type: number
        required: false
        default: 90
# Uploading an artifact uses the runner's own token and needs no permission here.
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # Default checkout uses refs/pull/N/merge for a pull request.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read trusted analysis settings
        id: settings
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha }}
          PUSHED_REV: ${{ github.sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const sha = /^[a-f0-9]{40,64}$/;
          let rev = process.env.BASE_REV;
          if (!rev) {
            // A push has no pull request base. Settings come from the first parent of the pushed commit,
            // the commit the Action compares it with, so a direct push cannot narrow its own record.
            // github.event.before is not used: a force push or a new branch makes it the wrong commit.
            // Only a root commit, which has no parent, is read itself.
            const pushed = process.env.PUSHED_REV;
            if (!sha.test(pushed ?? '')) throw new Error('Missing pushed commit');
            const [, parent] = execFileSync('git', ['rev-list', '--parents', '-n', '1', pushed], { encoding: 'utf8' }).trim().split(' ');
            rev = parent ?? pushed;
          }
          if (!sha.test(rev ?? '')) throw new Error('Missing settings commit');
          // .terratrust.json is the file's name before the rename to Diffseal.
          const file = ['.diffseal.json', '.terratrust.json'].find((f) => execFileSync('git', ['ls-tree', '--name-only', rev, '--', f], { encoding: 'utf8' }).trim());
          const config = file ? JSON.parse(execFileSync('git', ['show', `${rev}:${file}`], { encoding: 'utf8' })) : {};
          const settings = config.replay ?? {};
          if (typeof settings !== 'object' || Array.isArray(settings)) throw new Error('replay must be an object');
          for (const [key, output] of [['rootsUnder', 'roots-under'], ['policyFile', 'policy'], ['moduleCache', 'module-cache']]) {
            const value = settings[key] ?? '';
            if (typeof value !== 'string' || /[\r\n\\\x00]/.test(value) || value.startsWith('/') || /^[A-Za-z]:/.test(value) || value.split('/').includes('..')) throw new Error(`Invalid replay.${key}: use a path inside the repository`);
            appendFileSync(process.env.GITHUB_OUTPUT, `${output}=${value}\n`);
          }
          NODE
      # Keep this release tag in sync with the reusable workflow's release.
      # Never run the Action from the customer's checkout.
      - uses: diffseal/diffseal@v0.6.4-beta
        id: diffseal
        with:
          mode: pr
          upload: 'true'
          advisory: 'true'
          report-artifact: 'true'
          roots-under: ${{ steps.settings.outputs.roots-under }}
          policy: ${{ steps.settings.outputs.policy }}
          module-cache: ${{ steps.settings.outputs.module-cache }}
      # The full JSON and Markdown reports and the untrimmed change record, which the job summary may cut
      # short and the uploaded record may leave rows out of. report-dir is set only once a review ran.
      - name: Keep the full report
        if: ${{ !cancelled() && steps.diffseal.outputs.report-dir != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: ${{ steps.diffseal.outputs.artifact-name }}
          path: ${{ steps.diffseal.outputs.report-dir }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          # A re-run of the job replaces the artifact of the earlier attempt.
          overwrite: true

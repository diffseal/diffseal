name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Require release notes in an annotated tag
        run: test "$(git cat-file -t "$GITHUB_REF")" = tag
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Verify tagged build
        run: |
          bun run build
          git diff --exit-code -- dist/
          test -z "$(git ls-files --others --exclude-standard -- dist/)"
      - name: Package release
        run: |
          mkdir -p dist/licenses
          cp src/app/grammars/*.LICENSE dist/licenses/
          tar -czf "$RUNNER_TEMP/diffseal-$GITHUB_REF_NAME.tgz" dist LICENSE README.md
      - name: Publish release with tag notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/diffseal-$GITHUB_REF_NAME.tgz" \
            --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME" "${flags[@]}"

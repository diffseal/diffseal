name: False positive
description: Report a finding that should not be raised.
body:
  - type: markdown
    attributes:
      value: Use a small synthetic example. Remove credentials, secrets and private source before posting.
  - type: textarea
    id: snippet
    attributes:
      label: Minimal snippet
      description: Include the Terraform or application code, relevant configuration and command needed to reproduce the finding.
      render: text
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding text
      description: Paste the finding and include the TerraTrust version or Action commit.
      render: text
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this finding wrong?
      description: Explain the expected result and any context the analysis missed.
    validations:
      required: true

name: 'Diffseal'
description: 'Review Terraform changes on AWS without cloud credentials.'
author: 'Diffseal'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  upload:
    description: 'Upload the scrubbed change record using GitHub OIDC. Requires a trusted reusable workflow.'
    default: 'false'
  upload-url:
    description: 'Diffseal service URL.'
    default: 'https://api.diffseal.com'
  mode:
    description: >-
      pr: replay the pull request's changes (needs actions/checkout with fetch-depth: 0).
      plan: review a `terraform show -json` file.
    required: false
    default: 'pr'
  plan-json:
    description: 'Plan JSON for mode: plan'
    required: false
    default: 'tfplan.json'
  base:
    description: 'Compare against this revision. Defaults to the first parent of HEAD (the PR base for pull_request merge refs).'
    required: false
  roots-under:
    description: 'Only use Terraform roots under this path, e.g. infra/envs/prod'
    required: false
  module-cache:
    description: 'Optional path to verified module objects populated by diffseal modules fetch. Analysis never downloads modules.'
    required: false
  policy:
    description: 'Path to a policy JSON (requireCustomerManagedKeys, minBackupRetentionDays, blockOn).'
    required: false
  strict:
    description: 'Fail the job on REVIEW as well as BLOCK.'
    required: false
    default: 'false'
  advisory:
    description: 'Report and comment without failing the job, even on BLOCK.'
    required: false
    default: 'false'
  comment:
    description: 'Post or update one PR comment with the report.'
    required: false
    default: 'true'
  comment-author:
    description: 'Login that owns the report comment. Only a comment by this login is updated; set it when using an App token.'
    required: false
    default: 'github-actions[bot]'
  github-token:
    description: 'Token for the PR comment. Needs pull-requests: write.'
    required: false
    default: ${{ github.token }}
  report-artifact:
    description: >-
      Set to true when a later step uploads the report-dir output as the artifact named by the artifact-name output.
      A change record that leaves out resources then says the full list is in that artifact.
    required: false
    default: 'false'

outputs:
  upload-id:
    description: 'Stored Diffseal run id, when upload succeeds.'
  gate:
    description: 'pass, review or block'
  report-dir:
    description: 'Directory holding the full reports of this run: report.json, report.md and, when an upload built one, change-record.json. Set only when the review ran.'
  artifact-name:
    description: 'Name for the report artifact: diffseal- and the short commit reviewed.'

runs:
  using: 'node24'
  main: 'dist/action.js'
